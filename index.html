
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چاککەری وێنەی زیاد الکردی - Responsive Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Premium Kurdish & Arabic Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Readex+Pro:wght@400;700&family=Vazirmatn:wght@400;700&family=Lalezar&family=Almarai:wght@400;700&family=Cairo:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;700&family=El+Messiri:wght@400;700&family=Harmattan:wght@400;700&family=Lateef&family=Amiri:wght@400;700&family=Lemonada:wght@400;700&family=Changa:wght@400;700&family=Kufam:wght@400;700&family=Reem+Kufi:wght@400;700&family=Scheherazade+New&family=Markazi+Text&family=Zilla+Slab:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #020617; color: #f1f5f9; overflow-x: hidden; }
        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        #canvas-wrapper {
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 1);
            background-color: #0f172a;
            line-height: 0;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 600px; /* Max visual size for desktop */
            margin: 0 auto;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        input[type=range] { appearance: none; background: #1e293b; height: 4px; border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; height: 16px; width: 16px; background: #3b82f6; border-radius: 50%; cursor: pointer; border: 2px solid #020617; }
        
        .active-btn { border-color: #3b82f6 !important; color: #3b82f6 !important; background: #1e293b !important; }
        .arabic-text { font-family: 'Amiri', 'Noto Sans Arabic', serif; }
    </style>
</head>
<body class="p-2 md:p-6 select-none">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- Sidebar Controls -->
        <div class="w-full lg:w-[460px] space-y-4 max-h-[95vh] lg:overflow-y-auto pr-0 lg:pr-3 bg-slate-900/95 p-5 md:p-6 rounded-[2rem] border border-slate-800 shadow-2xl sidebar">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-black text-blue-400">چاککەری وێنەی زیاد الکردی</h1>
                <p class="text-[13px] text-slate-300 mt-2 arabic-text font-bold">لَا إِلَهَ إِلا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ</p>
                <div class="h-1 w-20 bg-blue-600 mx-auto mt-3 rounded-full opacity-50"></div>
            </div>

            <!-- 1. Background -->
            <div class="p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50 space-y-3">
                <label class="block text-[11px] font-bold text-blue-300 uppercase tracking-widest">١. وێنەی سەرەکی</label>
                <input type="file" id="bgInput" accept="image/*" class="w-full text-[10px] text-slate-400 file:bg-blue-600 file:text-white file:border-0 file:px-4 file:py-2 file:rounded-full cursor-pointer">
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div class="space-y-1">
                        <label class="text-[10px]">ڕوونی وێنە</label>
                        <input type="range" id="brightness" min="0" max="200" value="100" class="w-full">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px]">تاریکایی (Shadow)</label>
                        <input type="range" id="gradHeight" min="0" max="100" value="50" class="w-full">
                    </div>
                </div>
                <input type="color" id="gradColor" value="#000000" class="w-full h-8 rounded-lg bg-transparent border border-slate-700 cursor-pointer mt-2">
            </div>

            <!-- 2. Frame -->
            <div class="p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50 space-y-3">
                <div class="flex justify-between items-center"><label class="text-[11px] font-bold text-blue-300 uppercase">٢. چوارچێوە</label><input type="checkbox" id="frameCheck" checked class="w-4 h-4 accent-blue-500"></div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="range" id="frameWidth" min="10" max="100" value="90">
                    <input type="range" id="frameHeight" min="10" max="100" value="90">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="range" id="frameThickness" min="1" max="15" value="2">
                    <input type="color" id="frameColor" value="#ffffff" class="w-full h-8 rounded bg-transparent border border-slate-700 cursor-pointer">
                </div>
            </div>

            <!-- 3. Text & Box -->
            <div class="p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50 space-y-4">
                <label class="block text-[11px] font-bold text-blue-300 uppercase tracking-widest text-center border-b border-slate-700 pb-2">٣. ڕێکخستنی دەق و پشتێنە</label>
                <textarea id="textInput" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm h-20 outline-none focus:border-blue-500" placeholder="دەق بنووسە...">هیوادارین خزمەتێک بەدەعوەکاران بکات</textarea>
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-glass" onclick="setStyle('glass')" class="btn-style active-btn bg-slate-800 p-2 rounded-xl text-[10px] border border-slate-700">شووشەیی</button>
                    <button id="btn-dark" onclick="setStyle('dark')" class="btn-style bg-slate-800 p-2 rounded-xl text-[10px] border border-slate-700">تاریک</button>
                    <button id="btn-solid" onclick="setStyle('solid')" class="btn-style bg-slate-800 p-2 rounded-xl text-[10px] border border-slate-700">ڕەنگی تەواو</button>
                    <button id="btn-none" onclick="setStyle('none')" class="btn-style bg-slate-800 p-2 rounded-xl text-[10px] border border-slate-700">بێ پشتێنە</button>
                </div>

                <div class="grid grid-cols-2 gap-4 bg-slate-950/40 p-3 rounded-2xl border border-slate-800">
                    <div class="space-y-1">
                        <label class="text-[10px]">تۆخی (Opacity)</label>
                        <input type="range" id="boxOpacity" min="0" max="100" value="30">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px]">چەماوەیی (Radius)</label>
                        <input type="range" id="borderRadius" min="0" max="100" value="20">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div><label class="text-[9px]">پانی پشتێنە</label><input type="range" id="padX" min="10" max="250" value="70"></div>
                    <div><label class="text-[9px]">بەرزی پشتێنە</label><input type="range" id="padY" min="10" max="200" value="45"></div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px]">١٨ فۆنتی نایاب</label>
                        <select id="fontSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-[10px] outline-none">
                            <option value="Noto Sans Arabic">Noto Sans Arabic</option>
                            <option value="Readex Pro">Readex Pro</option>
                            <option value="Lalezar">Lalezar (قەڵەو)</option>
                            <option value="Vazirmatn">Vazirmatn</option>
                            <option value="Almarai">Almarai</option>
                            <option value="Cairo">Cairo</option>
                            <option value="Baloo Bhaijaan 2">Baloo</option>
                            <option value="Amiri">Amiri</option>
                            <option value="Changa">Changa</option>
                            <option value="Kufam">Kufam</option>
                            <option value="Lemonada">Lemonada</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px]">قەبارەی دەق</label>
                        <input type="range" id="fontSize" min="10" max="180" value="38">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <input type="color" id="textColor" value="#ffffff" class="w-full h-8 rounded bg-transparent border border-slate-700 cursor-pointer">
                    <input type="color" id="boxBgColor" value="#3b82f6" class="w-full h-8 rounded bg-transparent border border-slate-700 cursor-pointer">
                </div>

                <div class="bg-slate-950/50 p-3 rounded-2xl space-y-3 border border-slate-800">
                    <div class="flex items-center gap-2"><span class="text-[10px] w-4 text-slate-500 font-bold">X:</span><input type="range" id="textX" min="0" max="100" value="50" class="w-full"></div>
                    <div class="flex items-center gap-2"><span class="text-[10px] w-4 text-slate-500 font-bold">Y:</span><input type="range" id="textY" min="0" max="100" value="50" class="w-full"></div>
                </div>
            </div>

            <!-- 4. Logo -->
            <div class="p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50 space-y-3">
                <label class="block text-[11px] font-bold text-blue-300 uppercase tracking-widest">٤. لۆگۆ</label>
                <input type="file" id="logoInput" class="w-full text-[10px] text-slate-400 file:bg-slate-700 file:text-white file:border-0 file:px-4 file:py-1.5 file:rounded-full cursor-pointer">
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <input type="range" id="logoSize" min="20" max="500" value="120">
                    <input type="range" id="logoOpacity" min="0" max="100" value="100">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="range" id="logoX" min="0" max="100" value="50">
                    <input type="range" id="logoY" min="0" max="100" value="85">
                </div>
            </div>

            <button onclick="downloadImage()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-blue-900/40 active:scale-95 transition-all mb-10">
                داگرتنی وێنەی کۆتایی (Ultra HD)
            </button>
        </div>

        <!-- Preview Area (Responsive Canvas) -->
        <div class="flex-1 flex items-start lg:items-center justify-center p-4 min-h-[400px]">
            <div id="canvas-wrapper">
                <!-- Internal resolution is high (1200x1200px) but CSS scales it down -->
                <canvas id="mainCanvas" width="1200" height="1200"></canvas>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let bgImg = null;
        let logoImg = null;
        let currentStyle = 'glass';

        const inputs = [
            'bgInput', 'brightness', 'gradHeight', 'gradColor',
            'frameCheck', 'frameWidth', 'frameHeight', 'frameThickness', 'frameColor',
            'textInput', 'fontSelect', 'fontSize', 'textColor', 'boxBgColor',
            'boxOpacity', 'borderRadius', 'padX', 'padY', 'textX', 'textY',
            'logoInput', 'logoSize', 'logoOpacity', 'logoX', 'logoY'
        ];

        const state = {};
        inputs.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                state[id] = el.type === 'checkbox' ? el.checked : el.value;
                el.oninput = () => {
                    state[id] = el.type === 'checkbox' ? el.checked : el.value;
                    draw();
                };
            }
        });

        function setStyle(style) {
            currentStyle = style;
            document.querySelectorAll('.btn-style').forEach(b => b.classList.remove('active-btn'));
            document.getElementById('btn-' + style).classList.add('active-btn');
            draw();
        }

        document.getElementById('bgInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                bgImg = new Image();
                bgImg.onload = draw;
                bgImg.src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('logoInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                logoImg = new Image();
                logoImg.onload = draw;
                logoImg.src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Background
            if (bgImg) {
                ctx.save();
                ctx.filter = `brightness(${state.brightness}%)`;
                const scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
                const x = (canvas.width - bgImg.width * scale) / 2;
                const y = (canvas.height - bgImg.height * scale) / 2;
                ctx.drawImage(bgImg, x, y, bgImg.width * scale, bgImg.height * scale);
                ctx.restore();
            } else {
                ctx.fillStyle = "#111827";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Bottom Gradient
            const grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height * (1 - state.gradHeight / 100));
            grad.addColorStop(0, state.gradColor);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. Inset Frame
            if (state.frameCheck) {
                const fw = canvas.width * (state.frameWidth / 100);
                const fh = canvas.height * (state.frameHeight / 100);
                ctx.strokeStyle = state.frameColor;
                ctx.lineWidth = state.frameThickness * 2;
                ctx.strokeRect((canvas.width - fw) / 2, (canvas.height - fh) / 2, fw, fh);
            }

            // 4. Logo
            if (logoImg) {
                ctx.save();
                ctx.globalAlpha = state.logoOpacity / 100;
                const lSize = state.logoSize * 2;
                const lx = (canvas.width * state.logoX / 100) - lSize / 2;
                const ly = (canvas.height * state.logoY / 100) - (lSize * (logoImg.height/logoImg.width)) / 2;
                ctx.drawImage(logoImg, lx, ly, lSize, lSize * (logoImg.height/logoImg.width));
                ctx.restore();
            }

            // 5. Box & Text
            const txt = state.textInput || "";
            const fSize = state.fontSize * 2;
            ctx.font = `${fSize}px "${state.fontSelect}"`;
            const textMetrics = ctx.measureText(txt);
            const textWidth = textMetrics.width;

            const boxW = textWidth + (state.padX * 2);
            const boxH = fSize + (state.padY * 2);
            const bx = (canvas.width * state.textX / 100) - boxW / 2;
            const by = (canvas.height * state.textY / 100) - boxH / 2;

            if (currentStyle !== 'none') {
                ctx.save();
                const r = state.borderRadius * 2;
                ctx.beginPath();
                ctx.roundRect(bx, by, boxW, boxH, r);
                
                if (currentStyle === 'glass') {
                    ctx.fillStyle = `rgba(255, 255, 255, ${state.boxOpacity / 100})`;
                    ctx.shadowBlur = 40; ctx.shadowColor = "rgba(0,0,0,0.4)";
                } else if (currentStyle === 'dark') {
                    ctx.fillStyle = `rgba(0, 0, 0, ${state.boxOpacity / 100})`;
                } else if (currentStyle === 'solid') {
                    ctx.fillStyle = state.boxBgColor;
                }
                ctx.fill();

                if (currentStyle !== 'solid') {
                    ctx.strokeStyle = "rgba(255,255,255,0.25)";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Draw Text
            ctx.save();
            ctx.fillStyle = state.textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // Kurdish baseline correction logic
            const verticalNudge = fSize * 0.05; 
            ctx.fillText(txt, canvas.width * state.textX / 100, (canvas.height * state.textY / 100) - verticalNudge);
            ctx.restore();
        }

        async function downloadImage() {
            const link = document.createElement('a');
            link.download = `Zyad-Design-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        document.fonts.ready.then(() => draw());
        window.onload = draw;
    </script>
</body>
</html>
