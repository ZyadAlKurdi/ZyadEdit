
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چاککەری وێنەی زیاد الکردی - Screenshot Mode V12</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Premium Kurdish Style -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Readex+Pro:wght@400;700&family=Vazirmatn:wght@400;700&family=Lalezar&family=Almarai:wght@400;700&family=Cairo:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;700&family=El+Messiri:wght@400;700&family=Harmattan:wght@400;700&family=Lateef&family=Amiri:wght@400;700&family=Lemonada:wght@400;700&family=Changa:wght@400;700&family=Kufam:wght@400;700&family=Reem+Kufi:wght@400;700&family=Scheherazade+New&family=Markazi+Text&family=Zilla+Slab:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Using a more literal capture library for "Screenshot" behavior -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #020617; color: #f1f5f9; overflow-x: hidden; }
        
        /* 📸 The Capture Area - Fixed size to match screenshot logic */
        #canvas-container {
            width: 600px; height: 600px;
            position: relative; overflow: hidden;
            background: #0f172a; flex-shrink: 0;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 1);
            transform-origin: top center;
        }

        @media (max-width: 640px) {
            #canvas-container { transform: scale(0.6); margin-top: -100px; }
        }

        /* 🔒 Fixed Centering System */
        .text-wrapper {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transform: translate(-50%, -50%);
            width: max-content !important;
            z-index: 50;
            white-space: nowrap !important;
        }

        #glassBox {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: max-content !important;
            min-width: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
            line-height: 1 !important;
        }

        #mainText {
            margin: 0 !important;
            padding: 0 !important;
            white-space: nowrap !important;
            display: block;
            line-height: 1 !important;
            /* Small visual correction for Kurdish descenders on screen */
            transform: translateY(-1px);
        }

        input[type=range] { appearance: none; background: #1e293b; height: 4px; border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; height: 16px; width: 16px; background: #3b82f6; border-radius: 50%; cursor: pointer; border: 2px solid #020617; }
        
        .active-btn { border-color: #3b82f6 !important; color: #3b82f6 !important; background: #1e293b !important; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-2 md:p-6 select-none">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- Sidebar Controls -->
        <div class="w-full lg:w-[460px] space-y-4 max-h-[95vh] overflow-y-auto pr-3 bg-slate-900/95 p-6 rounded-[2.5rem] border border-slate-800 shadow-2xl">
            <div class="text-center mb-6 border-b border-slate-800 pb-4">
                <h1 class="text-2xl font-black text-blue-400">چاککەری وێنەی زیاد الکردی</h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1 italic">Screenshot Engine V12</p>
            </div>

            <!-- 1. Image Settings -->
            <div class="p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50 space-y-3">
                <label class="block text-[11px] font-bold text-blue-300 uppercase tracking-widest text-right">١. وێنەی سەرەکی و تدرج</label>
                <input type="file" id="bgInput" class="w-full text-[10px] text-slate-400 file:bg-blue-600 file:text-white file:border-0 file:px-4 file:py-2 file:rounded-full cursor-pointer">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px]">ڕوونی وێنە</label>
                        <input type="range" id="brightnessRange" min="0" max="200" value="100" class="w-full">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px]">تاریکایی (Gradient)</label>
                        <input type="range" id="gradHeight" min="0" max="100" value="50" class="w-full">
                    </div>
                </div>
                <input type="color" id="gradColor" value="#000000" class="w-full h-8 rounded-lg bg-transparent border border-slate-700 cursor-pointer">
            </div>

            <!-- 2. Frame Settings -->
            <div class="p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50 space-y-3">
                <div class="flex justify-between items-center"><label class="text-[11px] font-bold text-blue-300 uppercase">٢. چوارچێوە</label><input type="checkbox" id="frameCheck" checked></div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="range" id="frameWidth" min="10" max="100" value="90" title="Width">
                    <input type="range" id="frameHeight" min="10" max="100" value="90" title="Height">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="range" id="frameThickness" min="1" max="15" value="2" class="w-full">
                    <input type="color" id="frameColor" value="#ffffff" class="w-full h-8 rounded bg-transparent border border-slate-700">
                </div>
            </div>

            <!-- 3. Advanced Text Settings -->
            <div class="p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50 space-y-4">
                <label class="block text-[11px] font-bold text-blue-300 uppercase tracking-widest text-center border-b border-slate-700 pb-2">٣. ڕێکخستنی دەق و پشتێنە</label>
                <textarea id="textInput" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm h-16 outline-none focus:border-blue-500" placeholder="دەق لێرە بنووسە...">ناوەندی دەق قوفڵ کراوە</textarea>
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-glass" onclick="setStyle('style-glass')" class="bg-slate-800 p-2 rounded-xl text-[10px] border border-slate-700 active-btn transition-all">شووشەیی</button>
                    <button id="btn-dark" onclick="setStyle('style-dark')" class="bg-slate-800 p-2 rounded-xl text-[10px] border border-slate-700 transition-all">تاریک</button>
                    <button id="btn-solid" onclick="setStyle('style-solid')" class="bg-slate-800 p-2 rounded-xl text-[10px] border border-slate-700 transition-all">ڕەنگی تەواو</button>
                    <button id="btn-none" onclick="setStyle('style-none')" class="bg-slate-800 p-2 rounded-xl text-[10px] border border-slate-700 transition-all">بێ پشتێنە</button>
                </div>

                <div class="grid grid-cols-2 gap-4 bg-slate-950/40 p-3 rounded-2xl border border-slate-800">
                    <div class="space-y-1">
                        <label class="text-[10px]">تۆخی (Opacity)</label>
                        <input type="range" id="glassOpacity" min="0" max="100" value="20" class="w-full">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px]">لێڵی (Blur)</label>
                        <input type="range" id="glassBlur" min="0" max="50" value="15" class="w-full">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div><label class="text-[9px]">پانی پشتێنە</label><input type="range" id="padX" min="0" max="200" value="40" class="w-full"></div>
                    <div><label class="text-[9px]">بەرزی پشتێنە</label><input type="range" id="padY" min="0" max="200" value="20" class="w-full"></div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px]">١٨ فۆنتی ئەکۆکورد</label>
                        <select id="fontSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-[10px] outline-none">
                            <option value="'Noto Sans Arabic'">Noto Sans Arabic</option>
                            <option value="'Readex Pro'">Readex Pro</option>
                            <option value="'Lalezar'">Lalezar (قەڵەو)</option>
                            <option value="'Vazirmatn'">Vazirmatn</option>
                            <option value="'Almarai'">Almarai</option>
                            <option value="'Cairo'">Cairo</option>
                            <option value="'Baloo Bhaijaan 2'">Baloo</option>
                            <option value="'Harmattan'">Harmattan</option>
                            <option value="'Amiri'">Amiri</option>
                            <option value="'Lateef'">Lateef</option>
                            <option value="'Lemonada'">Lemonada</option>
                            <option value="'Changa'">Changa</option>
                            <option value="'Zilla Slab'">Zilla Slab</option>
                            <option value="'Markazi Text'">Markazi</option>
                            <option value="'Scheherazade New'">Scheherazade</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px]">قەبارەی دەق: <span id="sizeVal">30</span></label>
                        <input type="range" id="fontSize" min="10" max="300" value="30" class="w-full">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <input type="color" id="textColor" value="#ffffff" class="w-full h-8 rounded bg-transparent border border-slate-700 cursor-pointer">
                    <input type="color" id="boxBgColor" value="#3b82f6" class="w-full h-8 rounded bg-transparent border border-slate-700 cursor-pointer">
                </div>

                <div class="bg-slate-950/50 p-3 rounded-2xl space-y-3 border border-slate-800">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] w-4 text-slate-500 uppercase font-bold">X:</span>
                        <input type="range" id="textX" min="-50" max="150" value="50" class="w-full">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] w-4 text-slate-500 uppercase font-bold">Y:</span>
                        <input type="range" id="textY" min="-50" max="150" value="50" class="w-full">
                    </div>
                    <div class="space-y-1 text-center border-t border-slate-800 pt-2">
                        <label class="text-[9px]">چەماوەیی (Radius)</label>
                        <input type="range" id="borderRadius" min="0" max="200" value="30" class="w-full">
                    </div>
                </div>
            </div>

            <!-- 4. Logo Settings -->
            <div class="p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50 space-y-3">
                <label class="block text-[11px] font-bold text-blue-300 uppercase tracking-widest">٤. لۆگۆ</label>
                <input type="file" id="logoInput" class="w-full text-[10px] text-slate-400 file:bg-slate-700 file:text-white file:border-0 file:px-4 file:py-1.5 file:rounded-full">
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <input type="range" id="logoSize" min="20" max="500" value="100" class="w-full" title="Size">
                    <input type="range" id="logoOpacity" min="0" max="100" value="100" class="w-full" title="Opacity">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="range" id="logoX" min="0" max="100" value="50" class="w-full" title="X">
                    <input type="range" id="logoY" min="0" max="100" value="85" class="w-full" title="Y">
                </div>
            </div>

            <button onclick="takeScreenshot(this)" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-blue-900/40 active:scale-95 transition-all">
                گرتنی وێنەی شاشە (Screenshot)
            </button>
            <div class="h-12"></div>
        </div>

        <!-- Preview Area -->
        <div class="flex-1 flex items-start lg:items-center justify-center p-4">
            <div id="canvas-container">
                <img id="previewBg" src="" class="absolute inset-0 w-full h-full object-cover hidden">
                <div id="gradientOverlay" class="absolute inset-0 pointer-events-none transition-all duration-300"></div>
                <div id="frameLine" class="absolute pointer-events-none border-2 border-white/50 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"></div>

                <div id="textWrapper" class="text-wrapper" style="top: 50%; left: 50%;">
                    <div id="glassBox">
                        <p id="mainText"></p>
                    </div>
                </div>

                <div id="logoWrapper" class="absolute flex justify-center items-center pointer-events-none" style="top: 85%; left: 50%; transform: translate(-50%, -50%);">
                    <img id="previewLogo" src="" class="hidden object-contain drop-shadow-2xl">
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentStyleClass = 'style-glass';

        const els = {
            bgInput: document.getElementById('bgInput'),
            previewBg: document.getElementById('previewBg'),
            brightness: document.getElementById('brightnessRange'),
            brightVal: document.getElementById('brightVal'),
            gradOverlay: document.getElementById('gradientOverlay'),
            gradColor: document.getElementById('gradColor'),
            gradHeight: document.getElementById('gradHeight'),
            frameLine: document.getElementById('frameLine'),
            frameCheck: document.getElementById('frameCheck'),
            frameWidth: document.getElementById('frameWidth'),
            frameHeight: document.getElementById('frameHeight'),
            frameThickness: document.getElementById('frameThickness'),
            frameColor: document.getElementById('frameColor'),
            textInput: document.getElementById('textInput'),
            mainText: document.getElementById('mainText'),
            textWrapper: document.getElementById('textWrapper'),
            font: document.getElementById('fontSelect'),
            fontSize: document.getElementById('fontSize'),
            sizeVal: document.getElementById('sizeVal'),
            glassOpacity: document.getElementById('glassOpacity'),
            glassBlur: document.getElementById('glassBlur'),
            padX: document.getElementById('padX'),
            padY: document.getElementById('padY'),
            glassBox: document.getElementById('glassBox'),
            borderRadius: document.getElementById('borderRadius'),
            textX: document.getElementById('textX'),
            textY: document.getElementById('textY'),
            boxBgColor: document.getElementById('boxBgColor'),
            textColor: document.getElementById('textColor'),
            logoInput: document.getElementById('logoInput'),
            previewLogo: document.getElementById('previewLogo'),
            logoWrapper: document.getElementById('logoWrapper'),
            logoSize: document.getElementById('logoSize'),
            logoOpacity: document.getElementById('logoOpacity'),
            logoX: document.getElementById('logoX'),
            logoY: document.getElementById('logoY')
        };

        function setStyle(style) {
            currentStyleClass = style;
            ['btn-glass', 'btn-dark', 'btn-solid', 'btn-none'].forEach(id => {
                document.getElementById(id).classList.remove('active-btn');
            });
            document.getElementById('btn-' + style.split('-')[1]).classList.add('active-btn');
            updateUI();
        }

        const handleFile = (input, img) => {
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { img.src = ev.target.result; img.classList.remove('hidden'); updateUI(); };
                    reader.readAsDataURL(file);
                }
            };
        };
        handleFile(els.bgInput, els.previewBg);
        handleFile(els.logoInput, els.previewLogo);

        function updateUI() {
            if (els.brightVal) els.brightVal.innerText = els.brightness.value;
            if (els.sizeVal) els.sizeVal.innerText = els.fontSize.value;

            // BG Settings
            els.previewBg.style.filter = `brightness(${els.brightness.value}%)`;
            els.gradOverlay.style.background = `linear-gradient(to top, ${els.gradColor.value} 0%, transparent ${els.gradHeight.value}%)`;

            // Frame Settings
            els.frameLine.style.display = els.frameCheck.checked ? 'block' : 'none';
            els.frameLine.style.width = els.frameWidth.value + '%';
            els.frameLine.style.height = els.frameHeight.value + '%';
            els.frameLine.style.borderWidth = els.frameThickness.value + 'px';
            els.frameLine.style.borderColor = els.frameColor.value;

            // Text Styles
            els.mainText.innerText = els.textInput.value || " ";
            els.mainText.style.fontFamily = els.font.value;
            els.mainText.style.fontSize = els.fontSize.value + 'px';
            els.mainText.style.color = els.textColor.value;
            
            // Box Padding & Styling
            els.glassBox.style.padding = `${els.padY.value}px ${els.padX.value}px`;
            els.glassBox.style.borderRadius = els.borderRadius.value + 'px';
            
            const alpha = els.glassOpacity.value / 100;
            const blurAmt = els.glassBlur.value;

            if (currentStyleClass === 'style-glass') {
                els.glassBox.style.background = `rgba(255, 255, 255, ${alpha})`;
                els.glassBox.style.border = `1px solid rgba(255, 255, 255, 0.4)`;
                els.glassBox.style.backdropFilter = `blur(${blurAmt}px)`;
                els.glassBox.style.webkitBackdropFilter = `blur(${blurAmt}px)`;
            } else if (currentStyleClass === 'style-dark') {
                els.glassBox.style.background = `rgba(0, 0, 0, ${alpha})`;
                els.glassBox.style.border = `1px solid rgba(255, 255, 255, 0.1)`;
                els.glassBox.style.backdropFilter = `blur(${blurAmt}px)`;
                els.glassBox.style.webkitBackdropFilter = `blur(${blurAmt}px)`;
            } else if (currentStyleClass === 'style-solid') {
                els.glassBox.style.background = els.boxBgColor.value;
                els.glassBox.style.border = "none";
                els.glassBox.style.backdropFilter = "none";
                els.glassBox.style.webkitBackdropFilter = "none";
            } else {
                els.glassBox.style.background = "transparent";
                els.glassBox.style.border = "none";
                els.glassBox.style.backdropFilter = "none";
                els.glassBox.style.webkitBackdropFilter = "none";
            }

            // Absolute Positioning
            els.textWrapper.style.left = els.textX.value + '%';
            els.textWrapper.style.top = els.textY.value + '%';

            // Logo Movement
            els.previewLogo.style.width = els.logoSize.value + 'px';
            els.previewLogo.style.opacity = els.logoOpacity.value / 100;
            els.logoWrapper.style.left = els.logoX.value + '%';
            els.logoWrapper.style.top = els.logoY.value + '%';
        }

        Object.values(els).forEach(el => { if(el && el.tagName !== 'IMG') el.oninput = updateUI; });

        // 📸 REAL SCREENSHOT ENGINE
        async function takeScreenshot(btn) {
            const container = document.getElementById('canvas-container');
            const originalText = btn.innerText;
            btn.innerText = "Screenshot دەگیرێت...";
            btn.disabled = true;

            // Force a clean visual state
            updateUI();

            // Use html2canvas but with literal pixel capture options
            html2canvas(container, {
                scale: 4, // High resolution screenshot
                useCORS: true,
                backgroundColor: null,
                logging: false,
                // This ensures we capture EXACTLY what's on the screen pixels
                scrollX: 0,
                scrollY: -window.scrollY,
                onclone: (clonedDoc) => {
                    // This is the magic part: We don't let it recalculate.
                    // We lock the cloned elements to their actual screen positions.
                    const clonedBox = clonedDoc.getElementById('glassBox');
                    const clonedText = clonedDoc.getElementById('mainText');
                    
                    // Force the box to be a table-cell for absolute vertical lock during capture
                    clonedBox.style.display = 'table-cell';
                    clonedBox.style.verticalAlign = 'middle';
                    clonedBox.style.textAlign = 'center';
                    
                    // Final corrective nudge specifically for Kurdish baseline shift in chrome rendering
                    clonedText.style.transform = "translateY(-6%)";
                    clonedText.style.lineHeight = "1";
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Zyad-Screenshot-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
        
        window.onload = updateUI;
    </script>
</body>
</html>

```
